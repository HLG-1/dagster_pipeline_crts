version: "3.8"

services:
  # 1. Micro-service SAM3 (Segmentation GPU - NVIDIA L40s)
  sam3:
    build:
      context: .
      dockerfile: services/sam3_service/Dockerfile
    container_name: sam3-service
    restart: unless-stopped
    ports:
      - "8077:8077"
    environment:
      - SAM3_HOST=0.0.0.0
      - SAM3_PORT=8077
      - SAM3_DEVICE=cuda
      - SAM3_DTYPE=bfloat16
      # Poids locaux montes depuis le dossier checkpoints
      - SAM3_CHECKPOINT=/app/sam3_ckpt/sam3.pt
      - SAM3_FT_CHECKPOINT=/app/sam3_ckpt/sam3.pt
      - SAM3_USE_FT=1
      - SAM3_LABEL=building_ft_seg
      - HF_TOKEN=${HF_TOKEN:-}
      # Mode offline avec poids locaux
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
    volumes:
      # Monte le dossier contenant sam3.pt (lecture seule)
      - ./sam3_logs/building_ft_seg/checkpoints:/app/sam3_ckpt:ro
      - sam3_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8077/health"]
      interval: 20s
      timeout: 15s
      retries: 6
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 2. Dagster Webserver (Interface graphique port 3001)
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dagster-webserver
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DAGSTER_HOME=/app/.dagster_home
      - SAM3_URL=http://sam3:8077
      # Chemin DANS le conteneur (volume monte ci-dessous)
      - YOLO_WEIGHTS_PATH=/app/checkpoints/yolo11/best.pt
      - OUTPUT_DIR=results
      - PIPELINE_CONFIG_PATH=config/pipeline.yaml
      - PYTHONUNBUFFERED=1
    command: dagster-webserver -h 0.0.0.0 -p 3000 -w workspace.yaml
    volumes:
      - ./.dagster_home:/app/.dagster_home
      - ./src:/app/src
      - ./checkpoints:/app/checkpoints:ro
      - ./data:/app/data
      - ./results:/app/results
      - ./config:/app/config
    depends_on:
      sam3:
        # Attend que le health-check reponde ready:true (le modele met ~1-2 min
        # a charger sur L40s avec sam3.pt ~9.4 GB).
        condition: service_healthy

  # 3. Dagster Daemon (execution des runs + sensors — c'est LUI qui appelle YOLO/SAM3)
  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dagster-daemon
    restart: unless-stopped
    environment:
      - DAGSTER_HOME=/app/.dagster_home
      - SAM3_URL=http://sam3:8077
      - YOLO_WEIGHTS_PATH=/app/checkpoints/yolo11/best.pt
      - OUTPUT_DIR=results
      - PIPELINE_CONFIG_PATH=config/pipeline.yaml
      - PYTHONUNBUFFERED=1
    command: dagster-daemon run
    volumes:
      - ./.dagster_home:/app/.dagster_home
      - ./src:/app/src
      - ./checkpoints:/app/checkpoints:ro
      - ./data:/app/data
      - ./results:/app/results
      - ./config:/app/config
    depends_on:
      sam3:
        condition: service_healthy
      dagster-webserver:
        condition: service_started
    # YOLO tourne dans le daemon — GPU pour accelerer la detection
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  sam3_hf_cache: