# Configuration de l'instance Dagster locale (dev).
# Documentation : https://docs.dagster.io/deployment/dagster-instance

# Stockage des runs / logs en local pour le stage.
# A ajuster si besoin (ex: postgres) pour un usage plus durable.

run_storage:
  module: dagster._core.storage.runs
  class: SqliteRunStorage
  config:
    base_dir: .dagster_home/storage/runs

event_log_storage:
  module: dagster._core.storage.event_log
  class: SqliteEventLogStorage
  config:
    base_dir: .dagster_home/storage/event_logs

local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: .dagster_home

run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
